<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 600">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
    </style>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1120"/>
      <stop offset="100%" style="stop-color:#162032"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="card-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="840" height="600" rx="16" fill="url(#bg-grad)"/>

  <!-- Decorative elements -->
  <circle cx="720" cy="80" r="120" fill="rgba(34,211,238,0.03)"/>
  <circle cx="750" cy="100" r="80" fill="rgba(52,211,153,0.03)"/>
  <line x1="40" y1="120" x2="800" y2="120" stroke="url(#accent-grad)" stroke-width="2" opacity="0.3"/>

  <!-- ════════════════════════════════════════════════ -->
  <!-- HEADER SECTION                                 -->
  <!-- ════════════════════════════════════════════════ -->

  <text x="420" y="58" text-anchor="middle" fill="#e2e8f0" font-size="28" font-weight="700" filter="url(#glow)">[Lib] 文档知识库 Demo</text>
  <text x="420" y="84" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500">基于 LanceDB 的文档语义搜索系统</text>
  <text x="420" y="102" text-anchor="middle" fill="#64748b" font-size="10">Document Knowledge Base — Semantic Search with RAG</text>

  <!-- Version badge -->
  <rect x="640" y="40" width="80" height="22" rx="11" fill="rgba(34,211,238,0.12)" stroke="#22d3ee" stroke-width="0.8"/>
  <text x="680" y="55" text-anchor="middle" fill="#22d3ee" font-size="10" font-weight="600">v2.0</text>

  <!-- ════════════════════════════════════════════════ -->
  <!-- FEATURES SECTION (4 cards)                     -->
  <!-- ════════════════════════════════════════════════ -->

  <text x="40" y="150" fill="#e2e8f0" font-size="14" font-weight="600">[Star] 核心功能</text>

  <!-- Card 1 -->
  <g filter="url(#card-shadow)">
    <rect x="40" y="165" width="180" height="100" rx="10" fill="url(#card-grad)" stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.3"/>
    <text x="60" y="196" font-size="22">[Doc]</text>
    <text x="90" y="196" fill="#e2e8f0" font-size="14" font-weight="600">文档管理</text>
    <text x="60" y="218" fill="#94a3b8" font-size="9">拖拽上传 PDF / TXT / MD</text>
    <text x="60" y="233" fill="#94a3b8" font-size="9">/ DOCX / EML，自动解析</text>
    <text x="60" y="250" fill="#64748b" font-size="8">分块 → 向量化 → 索引</text>
  </g>

  <!-- Card 2 -->
  <g filter="url(#card-shadow)">
    <rect x="240" y="165" width="180" height="100" rx="10" fill="url(#card-grad)" stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.3"/>
    <text x="260" y="196" font-size="22">[Mail]</text>
    <text x="290" y="196" fill="#e2e8f0" font-size="14" font-weight="600">邮件导入</text>
    <text x="260" y="218" fill="#94a3b8" font-size="9">从本地邮件 DB 批量导入</text>
    <text x="260" y="233" fill="#94a3b8" font-size="9">.eml 格式解析 &amp; 存储</text>
    <text x="260" y="250" fill="#64748b" font-size="8">支持多文件夹</text>
  </g>

  <!-- Card 3 -->
  <g filter="url(#card-shadow)">
    <rect x="440" y="165" width="180" height="100" rx="10" fill="url(#card-grad)" stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.3"/>
    <text x="460" y="196" font-size="22">[Search]</text>
    <text x="490" y="196" fill="#e2e8f0" font-size="14" font-weight="600">语义搜索</text>
    <text x="460" y="218" fill="#94a3b8" font-size="9">基于向量相似度智能搜索</text>
    <text x="460" y="233" fill="#94a3b8" font-size="9">全流程执行步骤可视化</text>
    <text x="460" y="250" fill="#64748b" font-size="8">按文件类型过滤</text>
  </g>

  <!-- Card 4 -->
  <g filter="url(#card-shadow)">
    <rect x="640" y="165" width="180" height="100" rx="10" fill="url(#card-grad)" stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.3"/>
    <text x="660" y="196" font-size="22">[Chat]</text>
    <text x="690" y="196" fill="#e2e8f0" font-size="14" font-weight="600">智能问答</text>
    <text x="660" y="218" fill="#94a3b8" font-size="9">RAG 架构，基于知识库</text>
    <text x="660" y="233" fill="#94a3b8" font-size="9">回答附带来源引用</text>
    <text x="660" y="250" fill="#64748b" font-size="8">支持 Streaming</text>
  </g>

  <!-- ════════════════════════════════════════════════ -->
  <!-- TECH STACK                                      -->
  <!-- ════════════════════════════════════════════════ -->

  <text x="40" y="310" fill="#e2e8f0" font-size="14" font-weight="600">[Tools] 技术栈</text>

  <!-- Tech stack bars -->
  <g>
    <!-- Frontend -->
    <rect x="40" y="325" width="760" height="28" rx="6" fill="rgba(8,51,68,0.25)" stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.3"/>
    <text x="56" y="344" fill="#22d3ee" font-size="10" font-weight="600">前端</text>
    <text x="180" y="344" fill="#94a3b8" font-size="9">单 HTML 文件</text>
    <text x="320" y="344" fill="#94a3b8" font-size="9">Tailwind CSS</text>
    <text x="480" y="344" fill="#94a3b8" font-size="9">Chart.js</text>
    <text x="660" y="344" fill="#94a3b8" font-size="9">[Web] 浏览器端渲染</text>

    <!-- Backend -->
    <rect x="40" y="360" width="760" height="28" rx="6" fill="rgba(6,78,59,0.25)" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.3"/>
    <text x="56" y="379" fill="#34d399" font-size="10" font-weight="600">后端</text>
    <text x="180" y="379" fill="#94a3b8" font-size="9">FastAPI + uvicorn</text>
    <text x="320" y="379" fill="#94a3b8" font-size="9">sentence-transformers</text>
    <text x="480" y="379" fill="#94a3b8" font-size="9">PyMuPDF · python-docx</text>
    <text x="660" y="379" fill="#94a3b8" font-size="9">Python 3.9+</text>

    <!-- Database -->
    <rect x="40" y="395" width="760" height="28" rx="6" fill="rgba(76,29,149,0.25)" stroke="#a78bfa" stroke-width="0.8" stroke-opacity="0.3"/>
    <text x="56" y="414" fill="#a78bfa" font-size="10" font-weight="600">数据库</text>
    <text x="180" y="414" fill="#94a3b8" font-size="9">LanceDB（向量数据库）</text>
    <text x="320" y="414" fill="#94a3b8" font-size="9">SQLite（邮件存储）</text>
    <text x="660" y="414" fill="#94a3b8" font-size="9">384 维向量</text>

    <!-- LLM -->
    <rect x="40" y="430" width="760" height="28" rx="6" fill="rgba(136,19,55,0.2)" stroke="#fb7185" stroke-width="0.8" stroke-opacity="0.3"/>
    <text x="56" y="449" fill="#fb7185" font-size="10" font-weight="600">LLM</text>
    <text x="180" y="449" fill="#94a3b8" font-size="9">OpenAI 兼容接口</text>
    <text x="320" y="449" fill="#94a3b8" font-size="9">小米 MiMo（默认）</text>
    <text x="480" y="449" fill="#94a3b8" font-size="9">Ollama 本地部署</text>
  </g>

  <!-- ════════════════════════════════════════════════ -->
  <!-- QUICK START                                     -->
  <!-- ════════════════════════════════════════════════ -->

  <text x="40" y="492" fill="#e2e8f0" font-size="14" font-weight="600">[Rocket] 快速开始</text>

  <rect x="40" y="505" width="760" height="55" rx="8" fill="rgba(251,146,60,0.08)" stroke="#fb923c" stroke-width="0.8" stroke-opacity="0.3"/>
  <text x="60" y="524" fill="#e2e8f0" font-size="11" font-weight="500">$ ./start.sh</text>
  <text x="60" y="544" fill="#94a3b8" font-size="9">启动后访问 http://localhost:8000 → 上传文档 → 自动解析 → 向量化 → 智能问答</text>

  <!-- ════════════════════════════════════════════════ -->
  <!-- KEY METRICS                                     -->
  <!-- ════════════════════════════════════════════════ -->

  <rect x="40" y="575" width="760" height="16" rx="4" fill="rgba(30,41,59,0.4)"/>
  <text x="420" y="587" text-anchor="middle" fill="#64748b" font-size="8">文档知识库 Demo v2.0 · Powered by LanceDB + FastAPI + sentence-transformers</text>
</svg>