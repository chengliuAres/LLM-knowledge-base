<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Wiki — 知识库管理</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Fira Code (mono) + Fira Sans (UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- 全局暗色主题（侧边栏/侧边栏项/面板/按钮/输入框等） -->
    <link rel="stylesheet" href="css/theme.css">

    <!-- Chart.js（看板图表需要） -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="h-screen">
    <div class="flex h-screen overflow-hidden">
        <!-- 侧边栏：固定宽 224px（w-56），暗色背景由 .sidebar 提供 -->
        <aside class="sidebar">
            <!-- 头部：品牌 + 版本号 -->
            <div class="px-5 pb-4 mb-2 border-b" style="border-color: var(--color-border);">
                <h1 class="text-base font-semibold text-white">📚 Email Wiki</h1>
                <p class="text-xs mt-1" style="color: var(--color-muted);">v2.0 · 知识库管理</p>
            </div>

            <nav class="flex-1 overflow-y-auto">
                <!-- 第一组：文档知识管理 -->
                <div class="sidebar-group-label">文档知识管理</div>
                <a class="sidebar-item" data-route="doc/upload"     href="#doc/upload">📄 <span>文档上传</span></a>
                <a class="sidebar-item" data-route="doc/email"      href="#doc/email">📧 <span>邮件导入</span></a>
                <a class="sidebar-item" data-route="doc/chat"       href="#doc/chat">💬 <span>文档问答</span></a>
                <a class="sidebar-item" data-route="doc/dashboard"  href="#doc/dashboard">📊 <span>文档统计</span></a>
                <a class="sidebar-item" data-route="doc/lancedb"    href="#doc/lancedb">🗄️ <span>LanceDB 浏览器</span></a>

                <!-- 分隔线 -->
                <div class="my-3 mx-5 border-t" style="border-color: var(--color-border);"></div>

                <!-- 第二组：代码知识库 -->
                <div class="sidebar-group-label">代码知识库</div>
                <a class="sidebar-item" data-route="code/repos"     href="#code/repos">📁 <span>代码仓库</span></a>
                <a class="sidebar-item" data-route="code/search"    href="#code/search">🔍 <span>代码搜索</span></a>
                <a class="sidebar-item" data-route="code/chat"      href="#code/chat">💬 <span>代码问答</span></a>
                <a class="sidebar-item" data-route="code/dashboard" href="#code/dashboard">📊 <span>代码统计</span></a>
                <a class="sidebar-item" data-route="code/lancedb"   href="#code/lancedb">🗄️ <span>代码 LanceDB</span></a>
            </nav>

            <!-- 侧边栏底部：日志抽屉切换 + 导出 -->
            <div class="px-5 py-3 border-t flex items-center gap-2" style="border-color: var(--color-border);">
                <button id="btn-log-toggle"
                    class="btn btn-secondary flex-1"
                    title="切换日志抽屉">📜 日志</button>
                <button id="btn-log-export"
                    class="btn btn-accent"
                    title="导出日志文件">⬇</button>
            </div>
        </aside>

        <!-- 主内容区：路由切换注入的 tab HTML -->
        <main id="content-area" class="flex-1 overflow-y-auto p-6">
            <div class="text-slate-400 text-sm">加载中…</div>
        </main>
    </div>

    <!-- ─────────── 日志抽屉（可折叠，浮动悬浮） ─────────── -->
    <div id="log-panel"
         class="hidden fixed bottom-0 left-56 right-0 h-72 z-50 flex flex-col"
         style="background-color: #0F172A; color: #E2E8F0; border-top: 2px solid var(--color-border);">
        <div class="flex items-center justify-between px-4 py-2"
             style="background-color: #1E293B; border-bottom: 1px solid var(--color-border);">
            <span class="text-sm font-semibold">📜 日志（最近 100 条）</span>
            <div class="flex items-center gap-2 text-xs">
                <span id="log-panel-meta" style="color: var(--color-muted);">--</span>
                <button id="btn-log-collapse"
                    class="px-2 py-1 rounded hover:bg-slate-700">收起</button>
            </div>
        </div>
        <pre id="log-panel-body"
             class="flex-1 overflow-auto px-4 py-2 text-xs whitespace-pre-wrap leading-relaxed"
             style="font-family: var(--font-mono);"></pre>
    </div>

    <!-- ─────────── 脚本 ─────────── -->
    <script src="js/shared.js?v=3"></script>
    <script src="js/router.js?v=5"></script>
    <script>
        window.__TAB_VERSION = '2';
        // 显式启动路由（router.js 也会在 DOMContentLoaded 时自启，这里双保险）
        if (typeof initRouter === "function") {
            initRouter();
        } else if (window.Router && typeof window.Router.init === "function") {
            window.Router.init();
        }
    </script>

    <!-- ─────────── 日志抽屉行为：每 2s 拉取 /api/logs/tail ─────────── -->
    <script>
    (function () {
        const STORAGE_KEY = "kb_log_collapsed";
        const panel       = document.getElementById("log-panel");
        const body        = document.getElementById("log-panel-body");
        const meta        = document.getElementById("log-panel-meta");
        const btnToggle   = document.getElementById("btn-log-toggle");
        const btnCollapse = document.getElementById("btn-log-collapse");
        const btnExport   = document.getElementById("btn-log-export");

        let pollTimer = null;
        // localStorage[collapsed]=true 表示已折叠 → 初始默认折叠
        let isOpen = localStorage.getItem(STORAGE_KEY) !== "true";

        function render(lines) {
            body.innerHTML = lines.map((line) => {
                const escaped = String(line)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");
                let cls = "";
                if (/\b(ERROR|CRITICAL)\b/.test(line))      cls = "text-red-400";
                else if (/\bWARN(ING)?\b/.test(line))        cls = "text-amber-400";
                return `<span class="${cls}">${escaped}</span>`;
            }).join("\n");
            body.scrollTop = body.scrollHeight;
        }

        async function fetchTail() {
            try {
                const resp = await fetch("/api/logs/tail?lines=100");
                if (!resp.ok) return;
                const data = await resp.json();
                render(data.lines || []);
                meta.textContent = `${(data.lines || []).length} 行 / ${((data.total_bytes || 0) / 1024).toFixed(1)} KB`;
            } catch (_) {
                // 网络断时静默
            }
        }

        function openPanel() {
            panel.classList.remove("hidden");
            isOpen = true;
            localStorage.setItem(STORAGE_KEY, "false");
            fetchTail();
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(fetchTail, 2000);
        }

        function closePanel() {
            panel.classList.add("hidden");
            isOpen = false;
            localStorage.setItem(STORAGE_KEY, "true");
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }
        }

        btnToggle  .addEventListener("click", () => isOpen ? closePanel() : openPanel());
        btnCollapse.addEventListener("click", closePanel);
        btnExport  .addEventListener("click", () => { window.location.href = "/api/logs/export"; });

        // 初始：按 localStorage 决定开/关
        if (isOpen) openPanel();
    })();
    </script>
</body>
</html>
