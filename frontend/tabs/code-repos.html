<!-- 代码仓库 tab：扫描新仓库 + 已索引仓库列表 + 统计 + 过滤器 -->

<div class="max-w-7xl mx-auto">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <!-- 左列：扫描新仓库 -->
        <div class="lg:col-span-1 space-y-4">
            <div class="panel">
                <h3 class="font-semibold text-sm mb-3" style="color: var(--color-foreground);">📂 扫描新仓库</h3>
                <input id="codeRepoName" type="text" placeholder="仓库名 (自动填入)" class="input w-full mb-2">
                <div class="flex gap-1 mb-2">
                    <input id="codeRepoPath" type="text" placeholder="粘贴路径或点下方快捷入口" class="input flex-1" oninput="codeAutoFillName(this.value)">
                    <button onclick="codeBrowseFolder()" class="btn btn-secondary shrink-0" title="浏览目录">📂</button>
                </div>
                <!-- 快捷路径 -->
                <div id="codeQuickPaths" class="flex flex-wrap gap-1 mb-2"></div>
                <!-- 目录浏览器 -->
                <div id="codeFolderBrowser" class="hidden border rounded max-h-48 overflow-y-auto text-sm mb-2" style="background: var(--color-background); border-color: var(--color-border);"></div>
                <select id="codeProjectType" class="input w-full mb-2">
                    <option value="ios">iOS</option>
                    <option value="macos">macOS</option>
                    <option value="android">Android</option>
                    <option value="flutter">Flutter</option>
                    <option value="rn">React Native</option>
                    <option value="kmp">KMP</option>
                    <option value="generic">通用</option>
                </select>
                <div class="flex gap-2">
                    <button onclick="codeScanRepo()" id="codeScanBtn" class="btn btn-accent flex-1">🔍 开始扫描</button>
                    <button onclick="openSkipRulesModal()" class="btn btn-secondary shrink-0" title="排除规则">⚙️</button>
                </div>
                <div id="codeScanProgress" class="hidden mt-2">
                    <div class="flex items-center gap-2 mb-1">
                        <div class="flex-1 rounded-full h-2 overflow-hidden" style="background: var(--color-border);">
                            <div id="codeScanPctBar" class="h-2 rounded-full transition-all duration-300" style="width:0%; background: var(--color-accent);"></div>
                        </div>
                        <span id="codeScanPctText" class="text-xs font-mono shrink-0" style="color: var(--color-muted);">0%</span>
                    </div>
                    <button onclick="codeCancelScan()" class="btn btn-danger w-full text-xs">✕ 终止扫描</button>
                </div>
            </div>

            <!-- 扫描步骤（供 SSE 进度写入） -->
            <div class="panel">
                <h3 class="font-semibold text-sm mb-3" style="color: var(--color-foreground);">⚡ 执行流程</h3>
                <div id="codeSteps" class="space-y-2">
                    <div class="p-3 text-center text-xs" style="color: var(--color-muted);">等待操作...</div>
                </div>
            </div>
        </div>

        <!-- 右列：仓库列表 + 统计 + 过滤器 -->
        <div class="lg:col-span-2 space-y-4">
            <!-- 仓库列表 -->
            <div class="panel">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="font-semibold text-sm" style="color: var(--color-foreground);">📦 已索引仓库</h3>
                    <button onclick="codeClearAll()" id="codeClearBtn" class="text-[10px] hover:opacity-80 px-1.5 py-0.5 rounded" style="color: var(--color-destructive);">🗑️ 清空全部</button>
                </div>
                <div id="codeRepoList" class="space-y-2">
                    <div class="p-3 text-center text-xs" style="color: var(--color-muted);">暂无仓库</div>
                </div>
            </div>

            <!-- 统计 -->
            <div class="panel">
                <h3 class="font-semibold text-sm mb-2" style="color: var(--color-foreground);">📊 统计</h3>
                <div id="codeStats" class="text-xs" style="color: var(--color-muted);">加载中...</div>
            </div>

            <!-- 过滤器 -->
            <div class="panel">
                <h3 class="font-semibold text-sm mb-2" style="color: var(--color-foreground);">🔧 过滤器</h3>
                <select id="codeFilterRepo" class="input w-full mb-2"><option value="">全部仓库</option></select>
                <select id="codeFilterLang" class="input w-full mb-2"><option value="">全部语言</option></select>
                <select id="codeFilterType" class="input w-full"><option value="">全部类型</option></select>
            </div>
        </div>
    </div>
</div>

<!-- ─────────── 排除规则模态框 ─────────── -->
<div id="skip-rules-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4" style="background: rgba(0,0,0,0.5);">
    <div class="rounded-lg shadow-xl w-full max-w-3xl max-h-[85vh] flex flex-col" style="background: var(--color-primary); border: 1px solid var(--color-border);">
        <!-- 头部 -->
        <div class="flex items-center justify-between px-5 py-3" style="border-bottom: 1px solid var(--color-border);">
            <h3 class="font-semibold text-base" style="color: var(--color-foreground);">⚙️ 排除规则</h3>
            <div class="flex items-center gap-2">
                <button onclick="refreshSkipRules()" id="skip-rules-refresh-btn" class="btn btn-secondary text-xs py-1 px-2.5">🔄 刷新</button>
                <button onclick="openSkipRulesInFinder()" class="btn btn-secondary text-xs py-1 px-2.5">📂 在 Finder 中打开</button>
                <button onclick="resetSkipRules()" class="btn btn-secondary text-xs py-1 px-2.5">恢复默认</button>
                <button onclick="saveSkipRules()" class="btn btn-accent text-xs py-1 px-2.5">保存</button>
                <button onclick="closeSkipRulesModal()" class="btn btn-secondary text-xs py-1 px-2.5">关闭</button>
            </div>
        </div>

        <!-- 主体 -->
        <div class="flex-1 overflow-y-auto p-5 space-y-5">
            <!-- 预览统计 -->
            <div id="skip-rules-preview-bar" class="rounded px-3 py-2 text-sm" style="background: rgba(255,255,255,0.04); color: var(--color-muted);">
                ⏳ 计算中...
            </div>

            <!-- .gitignore 目录 -->
            <div class="rounded p-3" style="background: rgba(34, 197, 94, 0.08); border: 1px solid rgba(34, 197, 94, 0.25);">
                <div class="flex items-center justify-between mb-2">
                    <h4 class="text-sm font-semibold" style="color: var(--color-foreground);">📋 .gitignore 目录</h4>
                    <label class="flex items-center gap-1.5 text-xs cursor-pointer" style="color: var(--color-muted);">
                        <input id="gitignore-select-all" type="checkbox" checked onchange="toggleGitignoreAll(this.checked)" class="accent-green-600">
                        <span>全选/取消全选</span>
                    </label>
                </div>
                <div id="gitignore-dirs-body" class="text-xs">
                    <div style="color: var(--color-muted);">加载中…</div>
                </div>
            </div>

            <!-- 排除目录 -->
            <div>
                <h4 class="text-sm font-semibold mb-2" style="color: var(--color-foreground);">📁 排除目录</h4>
                <table class="w-full rounded text-left text-sm" style="border: 1px solid var(--color-border);">
                    <thead style="background: rgba(255,255,255,0.04); color: var(--color-muted);">
                        <tr>
                            <th class="py-1.5 px-2 font-semibold w-1/3 text-xs">名称</th>
                            <th class="py-1.5 px-2 font-semibold w-1/3 text-xs">分类</th>
                            <th class="py-1.5 px-2 font-semibold w-1/3 text-right text-xs">操作</th>
                        </tr>
                    </thead>
                    <tbody id="skip-dirs-body"></tbody>
                </table>
                <div class="flex gap-2 mt-2">
                    <input id="skip-dir-input" type="text" placeholder="目录名, 如 node_modules" class="input flex-1 text-xs" style="padding: 6px 10px;">
                    <select id="skip-dir-category" class="input text-xs shrink-0" style="width: auto; padding: 6px 10px;"></select>
                    <button onclick="addSkipRule('dirs')" class="btn btn-accent text-xs py-1 px-3 shrink-0">+ 添加</button>
                </div>
            </div>

            <!-- 排除扩展名 -->
            <div>
                <h4 class="text-sm font-semibold mb-2" style="color: var(--color-foreground);">📄 排除扩展名</h4>
                <table class="w-full rounded text-left text-sm" style="border: 1px solid var(--color-border);">
                    <thead style="background: rgba(255,255,255,0.04); color: var(--color-muted);">
                        <tr>
                            <th class="py-1.5 px-2 font-semibold w-1/3 text-xs">名称</th>
                            <th class="py-1.5 px-2 font-semibold w-1/3 text-xs">分类</th>
                            <th class="py-1.5 px-2 font-semibold w-1/3 text-right text-xs">操作</th>
                        </tr>
                    </thead>
                    <tbody id="skip-exts-body"></tbody>
                </table>
                <div class="flex gap-2 mt-2">
                    <input id="skip-ext-input" type="text" placeholder="扩展名, 如 .lock" class="input flex-1 text-xs" style="padding: 6px 10px;">
                    <select id="skip-ext-category" class="input text-xs shrink-0" style="width: auto; padding: 6px 10px;"></select>
                    <button onclick="addSkipRule('exts')" class="btn btn-accent text-xs py-1 px-3 shrink-0">+ 添加</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// 工具函数（escapeHtml 来自 shared.js）

// 加载仓库列表 + 统计 + 过滤器选项
async function codeLoadRepos() {
    try {
        const [reposRes, statsRes] = await Promise.all([
            fetch('/api/code/repos').then(r => r.json()),
            fetch('/api/code/stats').then(r => r.json()),
        ]);

        // 仓库列表
        const el = document.getElementById('codeRepoList');
        if (reposRes.repos.length === 0) {
            el.innerHTML = '<div class="p-3 text-center text-xs" style="color: var(--color-muted);">暂无仓库，请扫描新仓库</div>';
        } else {
            el.innerHTML = reposRes.repos.map(r => `
                <div class="border rounded p-3" style="border-color: var(--color-border); background: var(--color-background);">
                    <div class="flex items-center justify-between">
                        <span class="font-medium text-sm" style="color: var(--color-foreground);">${escapeHtml(r.name)}</span>
                        <span class="text-[10px] px-1.5 py-0.5 rounded" style="background: rgba(34, 197, 94, 0.15); color: var(--color-accent);">${escapeHtml(r.project_type)}</span>
                    </div>
                    <div class="text-xs mt-1" style="color: var(--color-muted);">${r.total_chunks || 0} chunks · ${(r.languages || []).join(', ')}</div>
                    <div class="text-[10px] mt-1" style="color: var(--color-muted);">${r.last_scanned ? new Date(r.last_scanned).toLocaleString() : '未扫描'}</div>
                    <div class="flex gap-1 mt-2">
                        <button onclick="codeRefreshRepo('${escapeHtml(r.name)}')" class="btn btn-secondary text-[10px] py-0.5 px-2">刷新</button>
                        <button onclick="codeDeleteRepo('${escapeHtml(r.name)}')" class="btn btn-danger text-[10px] py-0.5 px-2">删除</button>
                    </div>
                </div>
            `).join('');
        }

        // 统计
        const statsEl = document.getElementById('codeStats');
        if (statsRes.total_chunks > 0) {
            const langTags = Object.entries(statsRes.by_language || {}).map(([k, v]) => `<span class="px-1 rounded" style="background: var(--color-border); color: var(--color-foreground);">${k}:${v}</span>`).join(' ');
            const cemb = statsRes.code_embedder || {};
            const embLine = cemb.model_name ? `<div class="text-[10px] mt-1" style="color: var(--color-accent);">🧠 ${cemb.model_name.split('/').pop()} · ${cemb.dimension}维</div>` : '';
            statsEl.innerHTML = `<div>总 chunks: <b>${statsRes.total_chunks}</b></div><div>仓库: ${statsRes.total_repos}</div><div class="mt-1">${langTags}</div>${embLine}`;
        } else {
            const cemb = statsRes.code_embedder || {};
            const embLine = cemb.model_name ? `<div class="text-[10px] mt-1" style="color: var(--color-accent);">🧠 ${cemb.model_name.split('/').pop()} · ${cemb.dimension}维</div>` : '';
            statsEl.innerHTML = `<div style="color: var(--color-muted);">暂无数据</div>${embLine}`;
        }

        // 过滤器选项
        const repoSelect = document.getElementById('codeFilterRepo');
        repoSelect.innerHTML = '<option value="">全部仓库</option>' + reposRes.repos.map(r => `<option value="${escapeHtml(r.name)}">${escapeHtml(r.name)}</option>`).join('');

        const langs = new Set();
        reposRes.repos.forEach(r => (r.languages || []).forEach(l => langs.add(l)));
        document.getElementById('codeFilterLang').innerHTML = '<option value="">全部语言</option>' + [...langs].map(l => `<option value="${l}">${l}</option>`).join('');

    } catch (e) {
        console.error('codeLoadRepos error:', e);
    }
}

// SSE 扫描步骤去重渲染
function codeRenderScanProgress(steps) {
    const el = document.getElementById('codeSteps');
    const stepIcons = {
        scan_files: '📂', scan_files_done: '✅',
        compute_diff: '🔄', compute_diff_done: '✅',
        delete_removed: '🗑️', delete_removed_done: '✅',
        parsing: '📝', parse_done: '✅',
        embedding: '🧠', storing: '💾', store_done: '✅',
        done: '🎉', cancelled: '🛑', error: '❌', cleanup_done: '🧹',
    };

    // 高频步骤（parsing/embedding/storing）只保留最新一条
    const deduped = [];
    const seen = new Set();
    for (let i = steps.length - 1; i >= 0; i--) {
        const s = steps[i];
        const dedupeKey = ['parsing', 'embedding', 'storing'].includes(s.step) ? s.step : null;
        if (dedupeKey) {
            if (!seen.has(dedupeKey)) {
                seen.add(dedupeKey);
                deduped.unshift(s);
            }
        } else {
            deduped.unshift(s);
        }
    }

    el.innerHTML = deduped.map((s, i) => {
        const icon = stepIcons[s.step] || '⚙️';
        const isLast = i === deduped.length - 1;
        const isError = s.step === 'error';
        const isCancelled = s.step === 'cancelled';
        const borderColor = isError ? 'var(--color-destructive)' : isCancelled ? '#F59E0B' : 'var(--color-border)';
        const textColor = isError ? 'var(--color-destructive)' : isLast ? 'var(--color-foreground)' : 'var(--color-muted)';

        // 进度条
        let progressBar = '';
        if (s.pct !== undefined) {
            const barColor = s.pct >= 100 ? 'var(--color-accent)' : 'var(--color-accent)';
            progressBar = `
                <div class="mt-1.5 w-full rounded-full h-1.5 overflow-hidden" style="background: var(--color-border);">
                    <div class="h-1.5 rounded-full transition-all duration-300" style="width: ${s.pct}%; background: ${barColor};"></div>
                </div>
                <div class="flex justify-between text-[10px] mt-0.5" style="color: var(--color-muted);">
                    <span>${s.detail}</span>
                    <span class="font-mono">${s.pct}%</span>
                </div>`;
        }

        // 次要信息
        let subInfo = '';
        if (!progressBar) {
            if (s.file_idx) {
                subInfo = `<div class="text-[10px] mt-0.5" style="color: var(--color-muted);">文件 ${s.file_idx}/${s.total_files} · ${s.chunks_so_far || 0} chunks</div>`;
            } else if (s.total_chunks) {
                subInfo = `<div class="text-[10px] mt-0.5" style="color: var(--color-muted);">${s.total_chunks} chunks</div>`;
            }
        }

        return `<div class="border rounded p-2" style="border-color: ${borderColor};">
            <div class="flex items-start gap-1.5">
                <span class="shrink-0">${icon}</span>
                <div class="flex-1 min-w-0">
                    ${progressBar ? '' : `<div class="text-xs" style="color: ${textColor}; ${isLast && !isError && !isCancelled ? 'font-weight: 500;' : ''}">${s.detail || s.step}</div>`}
                    ${progressBar}
                    ${subInfo}
                </div>
            </div>
        </div>`;
    }).join('');

    el.scrollTop = el.scrollHeight;
}

// 通用步骤渲染（codeRenderSteps 来自 shared.js）

// 扫描按钮重置
function _resetScanBtn() {
    const btn = document.getElementById('codeScanBtn');
    btn.disabled = false;
    btn.textContent = '🔍 开始扫描';
}

// 启动扫描 + SSE 订阅
async function codeScanRepo() {
    const name = document.getElementById('codeRepoName').value.trim();
    const path = document.getElementById('codeRepoPath').value.trim();
    const type = document.getElementById('codeProjectType').value;
    if (!name || !path) return showToast('请填写仓库名和路径', 'warning');

    const btn = document.getElementById('codeScanBtn');
    const progressEl = document.getElementById('codeScanProgress');
    const pctBar = document.getElementById('codeScanPctBar');
    const pctText = document.getElementById('codeScanPctText');

    btn.disabled = true;
    btn.textContent = '⏳ 扫描中...';
    progressEl.classList.remove('hidden');
    pctBar.style.width = '0%';
    pctText.textContent = '0%';

    try {
        const res = await fetch('/api/code/scan', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({repo_name: name, repo_path: path, project_type: type, languages: []}),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || '扫描启动失败');

        window._currentScanId = data.scan_id;

        const stepsEl = document.getElementById('codeSteps');
        stepsEl.innerHTML = '';

        const evtSource = new EventSource(`/api/code/scan/${data.scan_id}/sse`);
        let steps = [];

        evtSource.addEventListener('progress', (e) => {
            const entry = JSON.parse(e.data);
            steps.push(entry);
            codeRenderScanProgress(steps);
            if (entry.pct !== undefined) {
                pctBar.style.width = entry.pct + '%';
                pctText.textContent = entry.pct + '%';
            }
        });

        evtSource.addEventListener('done', (e) => {
            const result = JSON.parse(e.data);
            evtSource.close();
            window._currentScanId = null;
            _resetScanBtn();

            if (result.status === 'completed') {
                pctBar.style.width = '100%';
                pctText.textContent = '100%';
                setTimeout(() => progressEl.classList.add('hidden'), 2000);
                codeLoadRepos();
            } else if (result.status === 'cancelled') {
                progressEl.classList.add('hidden');
                codeRenderScanProgress([...steps, {step: 'cancelled', detail: '🛑 已终止并清理'}]);
            } else if (result.status === 'error') {
                progressEl.classList.add('hidden');
                showToast('扫描出错: ' + result.error, 'error');
            }
        });

        evtSource.onerror = () => {
            evtSource.close();
            window._currentScanId = null;
            _resetScanBtn();
            progressEl.classList.add('hidden');
        };

    } catch (e) {
        showToast('扫描失败: ' + e.message, 'error');
        _resetScanBtn();
        progressEl.classList.add('hidden');
    }
}

// 终止当前扫描
async function codeCancelScan() {
    const scanId = window._currentScanId;
    if (!scanId) return;
    const btn = document.querySelector('#codeScanProgress button');
    if (btn) { btn.disabled = true; btn.textContent = '⏳ 终止中...'; }
    try {
        await fetch(`/api/code/scan/${scanId}/cancel`, {method: 'POST'});
    } catch (e) {
        console.error('Cancel failed:', e);
    }
}

// 路径输入时自动填仓库名
function codeAutoFillName(pathVal) {
    const nameEl = document.getElementById('codeRepoName');
    if (nameEl.value.trim()) return;
    const parts = pathVal.replace(/\/+$/, '').split('/');
    const folder = parts[parts.length - 1];
    if (folder && folder !== '.' && folder.length < 50) {
        nameEl.value = folder;
    }
}

// 快捷路径按钮：填入路径并打开目录浏览器
function codeQuickPath(path) {
    document.getElementById('codeRepoPath').value = path;
    codeLoadDirs(path);
}

// 切换目录浏览器显示
async function codeBrowseFolder() {
    const browser = document.getElementById('codeFolderBrowser');
    if (!browser.classList.contains('hidden')) {
        browser.classList.add('hidden');
        return;
    }
    const currentPath = document.getElementById('codeRepoPath').value.trim() || (window.__USER_HOME || '.');
    await codeLoadDirs(currentPath);
}

// 加载指定目录的子目录列表
async function codeLoadDirs(dirPath) {
    const browser = document.getElementById('codeFolderBrowser');
    browser.classList.remove('hidden');
    browser.innerHTML = '<div class="p-2 text-center text-xs" style="color: var(--color-muted);">加载中...</div>';
    try {
        const res = await fetch(`/api/code/browse?path=${encodeURIComponent(dirPath)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail);

        let html = `<div class="sticky top-0 px-2 py-1.5 border-b flex items-center gap-2" style="background: var(--color-primary); border-color: var(--color-border);">
            <span class="text-xs truncate flex-1 font-mono" style="color: var(--color-muted);">${escapeHtml(data.current)}</span>
            ${data.parent ? `<button id="btnParentDir" data-path="${escapeHtml(data.parent)}" class="btn btn-secondary text-xs py-0.5 px-2 shrink-0">⬆ 上级</button>` : ''}
        </div>`;

        if (data.dirs.length === 0) {
            html += '<div class="p-3 text-center text-xs" style="color: var(--color-muted);">无子目录</div>';
        } else {
            for (const d of data.dirs) {
                html += `<div class="dir-item flex items-center cursor-pointer px-2 py-1.5 border-b" style="border-color: var(--color-border);"
                            data-path="${escapeHtml(d.path)}" data-name="${escapeHtml(d.name)}">
                            <span class="mr-2">📁</span>
                            <span class="truncate" style="color: var(--color-foreground);">${escapeHtml(d.name)}</span>
                            <button class="dir-enter ml-auto text-[10px] hover:opacity-80 shrink-0" data-path="${escapeHtml(d.path)}" style="color: var(--color-muted);">进入 →</button>
                         </div>`;
            }
        }

        browser.innerHTML = html;
        // 事件委托：上级目录按钮
        const btnParent = browser.querySelector('#btnParentDir');
        if (btnParent) btnParent.addEventListener('click', () => codeLoadDirs(btnParent.dataset.path));
        // 事件委托：点击目录行填入路径，点击"进入"按钮导航
        browser.querySelectorAll('.dir-item').forEach(el => {
            el.addEventListener('click', (e) => {
                if (e.target.closest('.dir-enter')) {
                    e.stopPropagation();
                    codeLoadDirs(el.dataset.path);
                } else {
                    codeSelectDir(el.dataset.path, el.dataset.name);
                }
            });
        });
    } catch (e) {
        browser.innerHTML = `<div class="p-2 text-xs" style="color: var(--color-destructive);">⚠ ${e.message}</div>`;
    }
}

// 选中目录后填入路径 + 仓库名
function codeSelectDir(fullPath, name) {
    document.getElementById('codeRepoPath').value = fullPath;
    document.getElementById('codeRepoName').value = name;
    document.getElementById('codeFolderBrowser').classList.add('hidden');
}

// 刷新指定仓库
async function codeRefreshRepo(name) {
    if (!confirm(`确认刷新仓库 ${name}？`)) return;
    try {
        const res = await fetch(`/api/code/repos/${name}/refresh`, {method: 'POST'});
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail);
        codeRenderSteps('codeScanProgress', data.steps || []);
        showToast(`刷新完成: ${data.total_chunks} chunks`, 'success');
        codeLoadRepos();
    } catch (e) {
        showToast('刷新失败: ' + e.message, 'error');
    }
}

// 清空全部仓库
async function codeClearAll() {
    if (!confirm('确认清空全部索引？\n\n将删除所有仓库的 LanceDB 向量数据 + SQLite 关键词索引 + 配置记录。\n此操作不可恢复。')) return;
    const btn = document.getElementById('codeClearBtn');
    btn.disabled = true;
    btn.textContent = '⏳ 清空中...';
    try {
        const res = await fetch('/api/code/repos', {method: 'DELETE'});
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail);
        showToast(`已清空: ${data.deleted_chunks} chunks, ${data.cleared_repos.length} 个仓库`, 'success');
        codeLoadRepos();
    } catch (e) {
        showToast('清空失败: ' + e.message, 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = '🗑️ 清空全部';
    }
}

// 删除指定仓库
async function codeDeleteRepo(name) {
    if (!confirm(`确认删除仓库 ${name} 的索引？`)) return;
    try {
        const res = await fetch(`/api/code/repos/${name}`, {method: 'DELETE'});
        if (!res.ok) throw new Error((await res.json()).detail);
        codeLoadRepos();
    } catch (e) {
        showToast('删除失败: ' + e.message, 'error');
    }
}

// ── 排除规则 ──────────────────────────────────────────────
const SKIP_DIR_CATEGORIES = ['版本控制', '依赖', '构建产物', 'IDE', '资源', '缓存', '虚拟环境', '第三方', '自定义'];
const SKIP_EXT_CATEGORIES = ['图片', '字体', 'iOS/Mac资源', 'Android资源', '配置/数据', '自定义'];

let _skipRulesDraft = {dirs: [], exts: []};
let _gitignoreDraft = [];

function _getCurrentRepoPath() {
    const el = document.getElementById('codeRepoPath');
    return el ? el.value.trim() : '';
}

async function openSkipRulesModal() {
    document.getElementById('skip-rules-modal').classList.remove('hidden');
    await loadSkipRules();
    await loadPreview();
}

function closeSkipRulesModal() {
    document.getElementById('skip-rules-modal').classList.add('hidden');
}

async function loadPreview() {
    const bar = document.getElementById('skip-rules-preview-bar');
    if (!bar) return;
    bar.innerHTML = '⏳ 计算中...';
    const repoPath = _getCurrentRepoPath();
    if (!repoPath) {
        bar.innerHTML = '📊 预览：请先填写仓库路径';
        return;
    }
    try {
        const res = await fetch(`/api/code/skip-rules/preview?repo_path=${encodeURIComponent(repoPath)}`, {method: 'POST'});
        const data = await res.json();
        const filtered = data.filtered_files ?? 0;
        const total = data.total_files ?? 0;
        const skipped = data.skipped_files ?? 0;
        bar.innerHTML = `📊 预览：将扫描 <strong style="color: #93C5FD;">${filtered}</strong> / ${total} 个文件（排除 <strong style="color: #FCA5A5;">${skipped}</strong> 个）`;
    } catch (e) {
        bar.innerHTML = `<span style="color: var(--color-destructive);">预览加载失败: ${escapeHtml(e.message)}</span>`;
    }
}

async function refreshSkipRules() {
    const btn = document.getElementById('skip-rules-refresh-btn');
    if (!btn) return;
    const orig = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '刷新中...';
    try {
        await loadSkipRules();
        await loadPreview();
    } finally {
        btn.disabled = false;
        btn.innerHTML = orig;
    }
}

async function loadSkipRules() {
    try {
        const res = await fetch('/api/code/skip-rules');
        if (!res.ok) throw new Error('加载规则失败');
        const data = await res.json();
        _skipRulesDraft = {
            dirs: (data.skip_dirs || []).map(d => ({name: d.name, category: d.category})),
            exts: (data.skip_exts || []).map(d => ({name: d.name, category: d.category})),
        };
        renderSkipTable('skip-dirs-body', _skipRulesDraft.dirs, 'dirs');
        renderSkipTable('skip-exts-body', _skipRulesDraft.exts, 'exts');
        await loadGitignoreDirs(data.gitignore_selections || []);
    } catch (e) {
        showToast('加载排除规则失败: ' + e.message, 'error');
    }
}

async function loadGitignoreDirs(savedSelections) {
    const body = document.getElementById('gitignore-dirs-body');
    const selectAll = document.getElementById('gitignore-select-all');
    const repoPath = _getCurrentRepoPath();
    if (!repoPath) {
        body.innerHTML = '<div style="color: var(--color-muted);">请先在主页填写仓库路径</div>';
        selectAll.checked = false;
        selectAll.disabled = true;
        _gitignoreDraft = [];
        return;
    }
    try {
        const res = await fetch(`/api/code/gitignore-dirs?repo_path=${encodeURIComponent(repoPath)}`);
        if (!res.ok) throw new Error('加载 .gitignore 失败');
        const data = await res.json();
        const dirs = data.dirs || [];
        if (!dirs.length) {
            body.innerHTML = '<div style="color: var(--color-muted);">未找到 .gitignore 或无目录条目</div>';
            selectAll.checked = false;
            selectAll.disabled = true;
            _gitignoreDraft = [];
            return;
        }
        selectAll.disabled = false;
        const savedMap = new Map((savedSelections || []).map(s => [s.name, s.selected !== false]));
        _gitignoreDraft = dirs.map(name => ({
            name,
            selected: savedSelections && savedSelections.length ? (savedMap.get(name) !== false) : true,
        }));
        renderGitignoreDirs();
    } catch (e) {
        body.innerHTML = `<div style="color: var(--color-destructive);">${escapeHtml(e.message)}</div>`;
        _gitignoreDraft = [];
    }
}

function renderGitignoreDirs() {
    const body = document.getElementById('gitignore-dirs-body');
    if (!_gitignoreDraft.length) {
        body.innerHTML = '<div style="color: var(--color-muted);">未找到 .gitignore 或无目录条目</div>';
        return;
    }
    body.innerHTML = _gitignoreDraft.map((it, idx) => `
        <label class="inline-flex items-center gap-1.5 mr-3 mb-1.5 cursor-pointer">
            <input type="checkbox" ${it.selected ? 'checked' : ''} onchange="_gitignoreDraft[${idx}].selected = this.checked" class="accent-green-600">
            <span style="font-family: var(--font-mono); font-size: 12px; color: var(--color-foreground);">${escapeHtml(it.name)}</span>
        </label>
    `).join('');
    const allChecked = _gitignoreDraft.every(it => it.selected);
    const selectAll = document.getElementById('gitignore-select-all');
    if (selectAll) selectAll.checked = allChecked;
}

function toggleGitignoreAll(checked) {
    _gitignoreDraft.forEach(it => it.selected = checked);
    renderGitignoreDirs();
}

function renderSkipTable(containerId, items, type) {
    const tbody = document.getElementById(containerId);
    if (!items.length) {
        tbody.innerHTML = `<tr><td colspan="3" class="text-center py-3" style="color: var(--color-muted); font-size: 12px;">暂无规则</td></tr>`;
        return;
    }
    const grouped = {};
    items.forEach((it, idx) => {
        if (!grouped[it.category]) grouped[it.category] = [];
        grouped[it.category].push({...it, _idx: idx});
    });
    const sortedCats = Object.keys(grouped).sort();
    tbody.innerHTML = sortedCats.map(cat => {
        const rows = grouped[cat]
            .slice()
            .sort((a, b) => a.name.localeCompare(b.name))
            .map(it => `
            <tr style="border-top: 1px solid var(--color-border);">
                <td class="py-1.5 px-2 text-xs" style="font-family: var(--font-mono); color: var(--color-foreground);">${escapeHtml(it.name)}</td>
                <td class="py-1.5 px-2 text-xs" style="color: var(--color-muted);">${escapeHtml(it.category)}</td>
                <td class="py-1.5 px-2 text-right">
                    <button onclick="removeSkipRule('${type}', ${it._idx})" class="btn btn-danger text-xs py-0.5 px-2">删除</button>
                </td>
            </tr>`).join('');
        return `
            <tr style="background: rgba(255,255,255,0.04);">
                <td colspan="3" class="py-1 px-2" style="font-size: 11px; font-weight: 600; color: var(--color-muted); text-transform: uppercase; letter-spacing: 0.05em;">${escapeHtml(cat)} <span style="font-weight: 400;">(${grouped[cat].length})</span></td>
            </tr>
            ${rows}
        `;
    }).join('');
}

function addSkipRule(type) {
    const inputId = type === 'dirs' ? 'skip-dir-input' : 'skip-ext-input';
    const selectId = type === 'dirs' ? 'skip-dir-category' : 'skip-ext-category';
    const name = document.getElementById(inputId).value.trim();
    const category = document.getElementById(selectId).value;
    if (!name) return showToast('请输入规则名称', 'warning');
    if (name.includes('/')) return showToast('目录名/扩展名不能包含 / 字符', 'warning');
    const arr = type === 'dirs' ? _skipRulesDraft.dirs : _skipRulesDraft.exts;
    if (arr.some(it => it.name === name)) return showToast('该规则已存在', 'warning');
    arr.push({name, category});
    document.getElementById(inputId).value = '';
    renderSkipTable(type === 'dirs' ? 'skip-dirs-body' : 'skip-exts-body', arr, type);
}

function removeSkipRule(type, index) {
    const arr = type === 'dirs' ? _skipRulesDraft.dirs : _skipRulesDraft.exts;
    arr.splice(index, 1);
    renderSkipTable(type === 'dirs' ? 'skip-dirs-body' : 'skip-exts-body', arr, type);
}

async function saveSkipRules() {
    try {
        const res = await fetch('/api/code/skip-rules', {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                skip_dirs: _skipRulesDraft.dirs,
                skip_exts: _skipRulesDraft.exts,
                gitignore_selections: _gitignoreDraft.map(it => ({name: it.name, selected: it.selected})),
            }),
        });
        if (!res.ok) throw new Error('保存失败');
        showToast('已保存', 'success');
        await loadPreview();
        closeSkipRulesModal();
    } catch (e) {
        showToast('保存失败: ' + e.message, 'error');
    }
}

async function resetSkipRules() {
    if (!confirm('确定要恢复默认排除规则吗？当前修改会丢失。')) return;
    try {
        const res = await fetch('/api/code/skip-rules/reset', {method: 'POST'});
        if (!res.ok) throw new Error('重置失败');
        const data = await res.json();
        _skipRulesDraft = {
            dirs: (data.rules.skip_dirs || []).map(d => ({name: d.name, category: d.category})),
            exts: (data.rules.skip_exts || []).map(d => ({name: d.name, category: d.category})),
        };
        renderSkipTable('skip-dirs-body', _skipRulesDraft.dirs, 'dirs');
        renderSkipTable('skip-exts-body', _skipRulesDraft.exts, 'exts');
        await loadGitignoreDirs([]);
        await loadPreview();
    } catch (e) {
        showToast('重置失败: ' + e.message, 'error');
    }
}

async function openSkipRulesInFinder() {
    try {
        const res = await fetch('/api/code/skip-rules/open-finder', {method: 'POST'});
        if (!res.ok) throw new Error('打开 Finder 失败');
    } catch (e) {
        showToast('打开 Finder 失败: ' + e.message, 'error');
    }
}

// 初始化排除规则分类下拉选项
(function initSkipRuleSelects() {
    const dirSel = document.getElementById('skip-dir-category');
    const extSel = document.getElementById('skip-ext-category');
    if (dirSel) dirSel.innerHTML = SKIP_DIR_CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('');
    if (extSel) extSel.innerHTML = SKIP_EXT_CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('');
})();

// 加载快捷路径（动态获取 HOME）
async function codeLoadQuickPaths() {
    try {
        const res = await fetch('/api/user/home');
        if (!res.ok) throw new Error('获取 HOME 失败');
        const data = await res.json();
        window.__USER_HOME = data.home;
        const container = document.getElementById('codeQuickPaths');
        if (!container) return;
        const h = data.home;
        const paths = [
            { label: 'Desktop', path: h + '/Desktop' },
            { label: 'Documents', path: h + '/Documents' },
            { label: 'MailProject', path: h + '/MailProject', accent: true },
        ];
        container.innerHTML = paths.map(p =>
            `<button onclick="codeQuickPath('${p.path.replace(/'/g, "\\'")}')" class="text-xs border rounded px-1.5 py-0.5 hover:opacity-80${p.accent ? ' font-medium' : ''}" style="border-color: ${p.accent ? 'var(--color-accent)' : 'var(--color-border)'}; color: ${p.accent ? 'var(--color-accent)' : 'var(--color-muted)'};">${p.label}</button>`
        ).join('');
    } catch (e) {
        console.error('加载快捷路径失败:', e);
    }
}

// 初始化入口（由路由调用）
window.initCodeRepos = function() {
    codeLoadRepos();
    codeLoadQuickPaths();
};

// 暴露到 window（内联 onclick / 路由用）
window.codeLoadRepos = codeLoadRepos;
window.codeScanRepo = codeScanRepo;
window.codeCancelScan = codeCancelScan;
window.codeAutoFillName = codeAutoFillName;
window.codeQuickPath = codeQuickPath;
window.codeBrowseFolder = codeBrowseFolder;
window.codeLoadDirs = codeLoadDirs;
window.codeSelectDir = codeSelectDir;
window.codeRefreshRepo = codeRefreshRepo;
window.codeClearAll = codeClearAll;
window.codeDeleteRepo = codeDeleteRepo;
window.codeRenderScanProgress = codeRenderScanProgress;
window.openSkipRulesModal = openSkipRulesModal;
window.closeSkipRulesModal = closeSkipRulesModal;
window.refreshSkipRules = refreshSkipRules;
window.saveSkipRules = saveSkipRules;
window.resetSkipRules = resetSkipRules;
window.openSkipRulesInFinder = openSkipRulesInFinder;
window.addSkipRule = addSkipRule;
window.removeSkipRule = removeSkipRule;
window.toggleGitignoreAll = toggleGitignoreAll;
</script>
